<text x="744.0" y="492.0" font-size="16.5" font-weight="600" fill="#1f2a37" text-anchor="middle">Book rental</text>
<text x="744.0" y="513.0" font-size="13" fill="#5b6675" text-anchor="middle">deposit held in escrow</text>
