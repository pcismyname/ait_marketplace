<text x="1002.0" y="792.0" font-size="16.5" font-weight="600" fill="#1f2a37" text-anchor="middle">Release escrow funds</text>
<text x="1002.0" y="813.0" font-size="13" fill="#5b6675" text-anchor="middle">auto when window closes</text>
