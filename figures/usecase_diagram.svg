<text x="486.0" y="813.0" font-size="13" fill="#5b6675" text-anchor="middle">full or partial refund</text>
<ellipse cx="744.0" cy="795.0" rx="116.0" ry="39.0" fill="#ffffff" stroke="#be123c" stroke-width="2.2"/>
