<text x="142" y="184" font-size="19" font-weight="700" fill="#475569">AIT Student</text>
<text x="142" y="208" font-size="14" fill="#5b6675">every user (all roles below)</text>
<ellipse cx="486.0" cy="195.0" rx="116.0" ry="39.0" fill="#ffffff" stroke="#475569" stroke-width="2.2"/>
<text x="486.0" y="192.0" font-size="16.5" font-weight="600" fill="#1f2a37" text-anchor="middle">Sign up with AIT email</text>
<text x="486.0" y="213.0" font-size="13" fill="#5b6675" text-anchor="middle">@ait.asia only</text>
<ellipse cx="744.0" cy="195.0" rx="116.0" ry="39.0" fill="#ffffff" stroke="#475569" stroke-width="2.2"/>
<text x="744.0" y="192.0" font-size="16.5" font-weight="600" fill="#1f2a37" text-anchor="middle">Browse &amp; search listings</text>
<text x="744.0" y="213.0" font-size="13" fill="#5b6675" text-anchor="middle">filter: category, sale/rent, price</text>
<ellipse cx="1002.0" cy="195.0" rx="116.0" ry="39.0" fill="#ffffff" stroke="#475569" stroke-width="2.2"/>
<text x="1002.0" y="192.0" font-size="16.5" font-weight="600" fill="#1f2a37" text-anchor="middle">View listing</text>
<text x="1002.0" y="213.0" font-size="13" fill="#5b6675" text-anchor="middle">photos, price, item history</text>
<ellipse cx="1260.0" cy="195.0" rx="116.0" ry="39.0" fill="#ffffff" stroke="#475569" stroke-width="2.2"/>
<text x="1260.0" y="192.0" font-size="16.5" font-weight="600" fill="#1f2a37" text-anchor="middle">Chat about a listing</text>
<text x="1260.0" y="213.0" font-size="13" fill="#5b6675" text-anchor="middle">questions, pickup time</text>
<ellipse cx="1518.0" cy="195.0" rx="116.0" ry="39.0" fill="#ffffff" stroke="#475569" stroke-width="2.2"/>
<text x="1518.0" y="192.0" font-size="16.5" font-weight="600" fill="#1f2a37" text-anchor="middle">Rate &amp; review</text>
<text x="1518.0" y="213.0" font-size="13" fill="#5b6675" text-anchor="middle">after each exchange</text>
