<text x="744.0" y="553.5" font-size="12.5" font-weight="600" fill="#b45309" text-anchor="middle">Payment gateway</text>
<ellipse cx="1002.0" cy="495.0" rx="116.0" ry="39.0" fill="#ffffff" stroke="#c2410c" stroke-width="2.2"/>
<text x="1002.0" y="492.0" font-size="16.5" font-weight="600" fill="#1f2a37" text-anchor="middle">Confirm receipt / return</text>
<text x="1002.0" y="513.0" font-size="13" fill="#5b6675" text-anchor="middle">or let the window expire</text>
<ellipse cx="1260.0" cy="495.0" rx="116.0" ry="39.0" fill="#ffffff" stroke="#c2410c" stroke-width="2.2"/>
